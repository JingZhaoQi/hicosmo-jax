name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, codex ]
  pull_request:
    branches: [ main ]

jobs:
  import-smoke:
    # Fresh-clone smoke: the repo must import with no data directory and no
    # optional GW module (both gitignored). Guards the lazy-import chain and
    # the package-level x64 enablement.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Import smoke test
      run: |
        python -c "
        import hicosmo
        import hicosmo.likelihoods
        import hicosmo.models
        import hicosmo.samplers
        import hicosmo.fisher
        import hicosmo.visualization
        import jax
        assert jax.config.jax_enable_x64, 'package must enable x64'
        from hicosmo.models import LCDM, wCDM, CPL
        m = LCDM()
        rd = float(m.sound_horizon_drag(use_camb=False))
        assert 140.0 < rd < 155.0
        print('import smoke OK, rd =', rd)
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 hicosmo --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 hicosmo --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Format check with black
      run: black --check hicosmo/

    - name: Type check with mypy
      run: mypy hicosmo/ || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with pytest (data-free subset)
      # Most of the suite needs the 6.4GB local data directory, which is not
      # distributed with the repo; CI runs the subset that works without it.
      run: |
        pytest \
          tests/test_fisher_robustness.py \
          tests/test_sampler_backend.py \
          tests/test_runner_config.py \
          tests/test_models_parameters.py \
          -k "not unknown_cosmology_parameter and not registers_model_params and not likelihood_nuisance_parameter" \
          -v --cov=hicosmo --cov-report=xml

    - name: Upload coverage to Codecov
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "sphinx>=7,<8" sphinx_rtd_theme

    - name: Build Chinese docs
      run: cd docs_zh && READTHEDOCS=true make html

    - name: Build English docs
      run: cd docs_en && READTHEDOCS=true make html

    - name: Assemble site
      run: |
        mkdir -p _site
        cp -r docs_zh/build/html _site/zh
        cp -r docs_en/build/html _site/en
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=en/"></head><body><a href="en/">Documentation</a></body></html>' > _site/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v4
