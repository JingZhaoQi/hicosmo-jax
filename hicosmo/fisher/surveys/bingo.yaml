# BINGO single-dish survey
name: bingo
description: "BINGO single-dish survey"

instrument:
  telescope_type: single_dish
  ndish: 1
  dish_diameter_m: 40.0
  nbeam: 28
  aperture_efficiency: 0.7
  receiver_temperature_K: 50.0

observing:
  survey_area_deg2: 4130.0
  total_time_hours: 8760.0
  frequency_range_MHz: [960, 1260]
  channel_width_MHz: 1.0
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "Wuensche et al. 2022, A&A 664, A15 (28 horns, 40 m); Bull et al. 2015 Table 2 (T_inst)"
  notes: "Phase 1 focal plane with 28 horns"
