# Tianlai full-scale cylinder array
name: tianlai
description: "Tianlai full-scale cylinder array"

instrument:
  telescope_type: cylinder_array
  ncylinders: 8
  cylinder_width_m: 15.0
  cylinder_length_m: 120.0
  nfeeds: 2048
  min_baseline_m: 15.0  # shorter baselines excluded, as in Bull et al. (2015)
  nbeam: 1
  aperture_efficiency: 0.7
  receiver_temperature_K: 50.0

observing:
  survey_area_deg2: 10000.0
  total_time_hours: 8760.0
  frequency_range_MHz: [550, 950]
  channel_width_MHz: 0.5
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "Xu, Wang & Chen 2015; Bull et al. 2015 Table 2"
  notes: "8 cylinders 15 m x 120 m, 256 feeds each"
