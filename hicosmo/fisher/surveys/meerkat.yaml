# MeerKAT UHF-band survey (single-dish mode)
name: meerkat
description: "MeerKAT UHF-band survey (single-dish mode)"

instrument:
  telescope_type: single_dish
  ndish: 64
  dish_diameter_m: 13.5
  nbeam: 1
  aperture_efficiency: 0.8
  receiver_temperature_K: 23.0

observing:
  survey_area_deg2: 8250.0
  total_time_hours: 13140.0
  frequency_range_MHz: [580, 1015]
  channel_width_MHz: 0.4
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "Bull 2016 Table 1 (MeerKAT UHF band)"
  notes: "64 dishes; A_eff = 115 m^2 per dish (efficiency 0.80)"
