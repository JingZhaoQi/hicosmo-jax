# SKA1-MID Band 1 as in Bull 2016 (Rebaselined, 130 dishes)
name: ska1_bull2016_exact
description: "SKA1-MID Band 1 as in Bull 2016 (Rebaselined, 130 dishes)"

instrument:
  telescope_type: single_dish
  ndish: 130
  dish_diameter_m: 15.0
  nbeam: 1
  aperture_efficiency: 0.75
  receiver_temperature_K: 23.0

observing:
  survey_area_deg2: 25000.0
  total_time_hours: 10000.0
  frequency_range_MHz: [350, 1050]
  channel_width_MHz: 0.05
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "Bull 2016, ApJ 817, 26, Table 1"
  notes: "Reproduction configuration"
