# SKA1-MID Medium-Deep Band 2 survey (single-dish mode)
name: ska1_mid_band2
description: "SKA1-MID Medium-Deep Band 2 survey (single-dish mode)"

instrument:
  telescope_type: single_dish
  ndish: 133
  dish_diameter_m: 15.0
  nbeam: 1
  aperture_efficiency: 0.85
  receiver_temperature_K: 15.5

observing:
  survey_area_deg2: 5000.0
  total_time_hours: 10000.0
  frequency_range_MHz: [950, 1420]
  channel_width_MHz: 0.05
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "Bacon et al. 2020 (SKA Red Book) survey; Bull 2016 Table 1 (Rebaselined B2) receiver"
  notes: "133 SKA dishes; A_eff = 150 m^2 per dish (efficiency 0.85); IM restricted to z < 0.5"
