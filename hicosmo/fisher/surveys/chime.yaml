# CHIME cylinder array
name: chime
description: "CHIME cylinder array"

instrument:
  telescope_type: cylinder_array
  ncylinders: 4
  cylinder_width_m: 20.0
  cylinder_length_m: 100.0
  nfeeds: 1024
  min_baseline_m: 20.0  # shorter baselines excluded, as in Bull et al. (2015)
  nbeam: 1
  aperture_efficiency: 0.7
  receiver_temperature_K: 50.0

observing:
  survey_area_deg2: 22620.0
  total_time_hours: 26280.0
  frequency_range_MHz: [400, 800]
  channel_width_MHz: 0.39
  npol: 2

hi_tracers:
  # Bull et al. (2015) fits (RadioFisher 'powerlaw' model)
  bias_coefficients: [0.66650, 0.17764, 0.050219]
  omega_hi_coefficients: [4.8304e-4, 3.8856e-4, -6.5119e-5]

redshift_bins:
  delta_z: 0.1

metadata:
  schema_version: "3.0"
  reference: "CHIME Collaboration 2022 (ApJS 261, 29); Bull et al. 2015 Table 2 (T_inst)"
  notes: "4 cylinders 20 m x 100 m, 256 feeds each; 3-year drift scan"
