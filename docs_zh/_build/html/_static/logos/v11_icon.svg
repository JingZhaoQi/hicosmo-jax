<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v11i_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="v11i_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v11i_bg)"/>

  <!-- Expansion rings -->
  <g transform="translate(50, 45)">
    <circle cx="0" cy="0" r="35" stroke="#4ecdc4" stroke-width="0.4" fill="none" opacity="0.2"/>
    <circle cx="0" cy="0" r="28" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="21" stroke="#4ecdc4" stroke-width="0.6" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="14" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="url(#v11i_glow)"/>
    <circle cx="0" cy="0" r="3" fill="#e94560"/>

    <!-- Arrows -->
    <g stroke="#e94560" stroke-width="1.2" opacity="0.6">
      <line x1="8" y1="0" x2="20" y2="0"/>
      <line x1="-8" y1="0" x2="-20" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="-20"/>
      <line x1="0" y1="8" x2="0" y2="20"/>
    </g>
  </g>

  <!-- JAX -->
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#e94560" font-weight="600">JAX</text>
</svg>
