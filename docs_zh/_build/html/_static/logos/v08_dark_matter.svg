<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <rect width="420" height="140" fill="#000000"/>

  <!-- Dark matter web -->
  <g stroke="#ffffff" stroke-width="0.2" opacity="0.06">
    <line x1="0" y1="45" x2="95" y2="68"/><line x1="95" y1="68" x2="145" y2="38"/>
    <line x1="95" y1="68" x2="175" y2="98"/><line x1="175" y1="98" x2="245" y2="78"/>
    <line x1="245" y1="78" x2="295" y2="108"/><line x1="245" y1="78" x2="315" y2="48"/>
    <line x1="315" y1="48" x2="420" y2="58"/>
  </g>

  <!-- Web nodes -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="95" cy="68" r="3"/><circle cx="175" cy="98" r="2"/>
    <circle cx="245" cy="78" r="2.5"/><circle cx="315" cy="48" r="2"/>
  </g>

  <!-- Central H void -->
  <circle cx="65" cy="70" r="35" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
  <circle cx="65" cy="70" r="25" fill="none" stroke="#e94560" stroke-width="0.5" opacity="0.25"/>
  <circle cx="65" cy="70" r="14" fill="#e94560"/>
  <text x="65" y="75" text-anchor="middle" font-family="Helvetica, Arial" font-size="16" fill="#000000" font-weight="bold">H</text>

  <!-- Typography -->
  <text x="125" y="72" font-family="Helvetica Neue, Arial" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-2">
    HICOSMO
  </text>

  <!-- JAX accent -->
  <rect x="125" y="88" width="42" height="3" fill="#e94560"/>

  <!-- Tech stack minimal -->
  <g transform="translate(125, 105)">
    <text font-family="SF Mono, Courier" font-size="9" fill="#e94560" font-weight="700">JAX</text>
    <text x="30" font-family="Helvetica" font-size="9" fill="#ffffff" opacity="0.3">DARK ENERGY CONSTRAINTS</text>
  </g>

  <!-- Corner marks -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <path d="M 8 8 L 8 25 M 8 8 L 25 8"/>
    <path d="M 412 8 L 412 25 M 412 8 L 395 8"/>
    <path d="M 8 132 L 8 115 M 8 132 L 25 132"/>
    <path d="M 412 132 L 412 115 M 412 132 L 395 132"/>
  </g>
</svg>
