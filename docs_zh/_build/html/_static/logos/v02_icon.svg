<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v2i_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="v2i_glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v2i_bg)"/>

  <!-- Orbital system -->
  <g transform="translate(50, 45)">
    <ellipse cx="0" cy="0" rx="32" ry="12" stroke="#4ecdc4" stroke-width="1.5" fill="none" transform="rotate(-30)" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="28" ry="10" stroke="#4ecdc4" stroke-width="2" fill="none" transform="rotate(30)" opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#e94560" filter="url(#v2i_glow)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#fff" font-weight="bold">H</text>
    <circle cx="26" cy="-8" r="4" fill="#4ecdc4" filter="url(#v2i_glow)"/>
  </g>

  <!-- JAX label -->
  <rect x="30" y="78" width="40" height="14" rx="3" fill="#4ecdc4" opacity="0.2"/>
  <text x="50" y="89" text-anchor="middle" font-family="SF Mono, monospace" font-size="9" fill="#4ecdc4" font-weight="600">JAX</text>
</svg>
