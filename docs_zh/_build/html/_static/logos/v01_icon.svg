      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v1i_bg)"/>

  <!-- Minimal H atom -->
