<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v12i_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v12i_bg)"/>

  <!-- Posterior contours -->
  <g transform="translate(50, 45)">
    <!-- Axes -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#4ecdc4" stroke-width="0.3" opacity="0.4"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#4ecdc4" stroke-width="0.3" opacity="0.4"/>

    <!-- 3σ -->
    <ellipse cx="0" cy="0" rx="32" ry="24" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.25" transform="rotate(-25)"/>
    <!-- 2σ -->
    <ellipse cx="0" cy="0" rx="22" ry="16" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.4" transform="rotate(-25)"/>
    <!-- 1σ -->
    <ellipse cx="0" cy="0" rx="12" ry="8" stroke="#e94560" stroke-width="1.2" fill="#e94560" fill-opacity="0.2" transform="rotate(-25)"/>

    <!-- Best fit -->
    <circle cx="0" cy="0" r="3" fill="#e94560"/>
  </g>

  <!-- JAX -->
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#e94560" font-weight="600">JAX</text>
</svg>
