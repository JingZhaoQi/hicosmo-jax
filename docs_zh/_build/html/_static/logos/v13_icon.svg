<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v13i_bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v13i_bg)"/>

  <!-- Mini Hubble diagram -->
  <g transform="translate(15, 75)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="70" y2="0" stroke="#4ecdc4" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#4ecdc4" stroke-width="0.5" opacity="0.5"/>

    <!-- Data points -->
    <g fill="#4ecdc4" opacity="0.5">
      <circle cx="8" cy="-8" r="2"/>
      <circle cx="18" cy="-18" r="2"/>
      <circle cx="28" cy="-28" r="2"/>
      <circle cx="40" cy="-38" r="2"/>
      <circle cx="52" cy="-46" r="2"/>
      <circle cx="64" cy="-54" r="2"/>
    </g>

    <!-- Best fit curve -->
    <path d="M 4,-4 Q 25,-22 45,-38 T 68,-56" stroke="#e94560" stroke-width="2" fill="none"/>
  </g>

  <!-- JAX -->
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#e94560" font-weight="600">JAX</text>
</svg>
