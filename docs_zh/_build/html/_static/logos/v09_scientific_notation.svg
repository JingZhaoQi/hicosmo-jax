<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v9_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf9f6"/>
      <stop offset="100%" style="stop-color:#f0efe8"/>
    </linearGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v9_bg)"/>

  <!-- Paper lines -->
  <g stroke="#d0cfc8" stroke-width="0.3" opacity="0.5">
    <line x1="0" y1="32" x2="420" y2="32"/>
    <line x1="0" y1="108" x2="420" y2="108"/>
  </g>

  <!-- Mathematical notation -->
  <g font-family="Times, Georgia, serif">
    <!-- Logo as equation -->
    <text x="28" y="72" font-size="36" fill="#1a1a1a" font-style="italic">
      <tspan font-weight="bold" fill="#c73659">H</tspan><tspan font-size="22" dy="6">I</tspan>
    </text>
    <text x="72" y="72" font-size="26" fill="#1a1a1a">cosmo</text>

    <!-- Equals -->
    <text x="175" y="72" font-size="26" fill="#4a4a4a">=</text>

    <!-- Integral -->
    <text x="205" y="72" font-size="34" fill="#4a4a4a">∫</text>

    <!-- Function -->
    <text x="230" y="65" font-size="16" fill="#1a1a1a" font-style="italic">ρ</text>
    <text x="243" y="65" font-size="12" fill="#4a4a4a">(</text>
    <text x="250" y="65" font-size="16" fill="#1a1a1a" font-style="italic">z</text>
    <text x="262" y="65" font-size="12" fill="#4a4a4a">)</text>
    <text x="275" y="65" font-size="16" fill="#1a1a1a" font-style="italic">dV</text>
  </g>

  <!-- Subscript -->
  <text x="230" y="82" font-family="Times, serif" font-size="9" fill="#666" font-style="italic">HI</text>

  <!-- Citation -->
  <text x="315" y="72" font-family="Times, serif" font-size="11" fill="#888">[1]</text>

  <!-- JAX footnote -->
  <line x1="28" y1="98" x2="200" y2="98" stroke="#1a1a1a" stroke-width="0.4" opacity="0.3"/>
  <text x="28" y="118" font-family="Times, serif" font-size="9" fill="#666">
    [1] JAX-based cosmological parameter estimation framework
  </text>

  <!-- Tech badge -->
  <g transform="translate(330, 98)">
    <rect x="0" y="0" width="40" height="16" rx="3" fill="#c73659" opacity="0.1"/>
    <text x="20" y="12" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#c73659" font-weight="600">JAX</text>
  </g>

  <!-- Page number -->
  <text x="385" y="125" font-family="Times, serif" font-size="10" fill="#888" text-anchor="end">— 1 —</text>
</svg>
