<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0a0a12"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="1" opacity="0.6"/><circle cx="80" cy="25" r="0.8" opacity="0.5"/>
    <circle cx="75" cy="80" r="0.7" opacity="0.4"/><circle cx="25" cy="78" r="0.6" opacity="0.5"/>
  </g>

  <!-- Constellation -->
  <g stroke="#4ecdc4" stroke-width="0.5" opacity="0.3">
    <line x1="35" y1="35" x2="50" y2="30"/><line x1="50" y1="30" x2="65" y2="38"/>
    <line x1="65" y1="38" x2="55" y2="55"/><line x1="55" y1="55" x2="35" y2="35"/>
  </g>

  <!-- H star -->
  <circle cx="50" cy="42" r="14" fill="#e94560"/>
  <text x="50" y="47" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#fff" font-style="italic">H</text>

  <!-- JAX -->
  <text x="50" y="78" text-anchor="middle" font-family="Garamond, serif" font-size="10" fill="#4ecdc4" font-style="italic">JAX</text>
  <text x="50" y="90" text-anchor="middle" font-family="Courier" font-size="6" fill="#fff" opacity="0.4">ATLAS</text>
</svg>
