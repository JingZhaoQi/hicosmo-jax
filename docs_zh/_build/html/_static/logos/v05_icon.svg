<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="v5i_grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#4ecdc4" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="100" height="100" rx="16" fill="#0a0a12"/>
  <rect width="100" height="100" rx="16" fill="url(#v5i_grid)"/>

  <!-- Parameter graph -->
  <g transform="translate(50, 40)">
    <circle cx="0" cy="0" r="16" fill="#e94560"/>
    <text x="0" y="6" text-anchor="middle" font-family="Courier" font-size="14" fill="#fff" font-weight="bold">H</text>
    <circle cx="-20" cy="-15" r="4" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="20" cy="-15" r="4" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="-20" cy="18" r="3" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="20" cy="18" r="3" fill="#4ecdc4" opacity="0.4"/>
    <g stroke="#4ecdc4" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="-16" x2="-18" y2="-15"/><line x1="0" y1="-16" x2="18" y2="-15"/>
      <line x1="0" y1="16" x2="-18" y2="18"/><line x1="0" y1="16" x2="18" y2="18"/>
    </g>
  </g>

  <!-- JAX badge -->
  <rect x="30" y="75" width="40" height="16" rx="3" fill="#e94560"/>
  <text x="50" y="87" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#fff" font-weight="700">JAX</text>
</svg>
