<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>

    <!-- Atom core gradient -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73659"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="20" cy="25" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="80" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="75" cy="75" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="25" cy="80" r="1" fill="#fff" opacity="0.4"/>

  <!-- Electron orbits -->
  <g transform="translate(50, 50)">
    <ellipse cx="0" cy="0" rx="35" ry="14"
             stroke="#4ecdc4" stroke-width="2" fill="none"
             transform="rotate(-35)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="35" ry="14"
             stroke="#4ecdc4" stroke-width="2" fill="none"
             transform="rotate(35)" opacity="0.6"/>

    <!-- Nucleus -->
    <circle cx="0" cy="0" r="18" fill="url(#core)" filter="url(#glow)"/>

    <!-- H letter -->
    <text x="0" y="7" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22"
          fill="#fff">H</text>

    <!-- Electrons -->
    <circle cx="30" cy="-15" r="5" fill="#4ecdc4" filter="url(#glow)"/>
    <circle cx="-28" cy="18" r="4" fill="#4ecdc4" opacity="0.7"/>
  </g>

  <!-- Subtle ring decoration -->
  <circle cx="50" cy="50" r="45" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.3"/>

</svg>
