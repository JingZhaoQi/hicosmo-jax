<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v7_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a15"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="v7_dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1a1a28"/>
    </linearGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v7_sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="45" cy="18" r="1" opacity="0.8"/><circle cx="95" cy="32" r="0.6" opacity="0.5"/>
    <circle cx="145" cy="12" r="0.8" opacity="0.6"/><circle cx="215" cy="22" r="0.7" opacity="0.5"/>
    <circle cx="295" cy="15" r="0.9" opacity="0.7"/><circle cx="355" cy="28" r="0.5" opacity="0.4"/>
    <circle cx="385" cy="42" r="0.7" opacity="0.6"/>
  </g>

  <!-- Observatory -->
  <g transform="translate(45, 92)">
    <rect x="-12" y="15" width="65" height="33" fill="#1a1a25"/>
    <path d="M -8 15 Q 20 -22, 48 15 Z" fill="url(#v7_dome)" stroke="#2a2a40" stroke-width="1"/>
    <path d="M 15 15 L 18 -8 L 22 -8 L 25 15 Z" fill="#0a0a15"/>
    <line x1="20" y1="0" x2="95" y2="-52" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="0" x2="90" y2="-54" stroke="#4ecdc4" stroke-width="0.5" opacity="0.25"/>
    <line x1="20" y1="0" x2="100" y2="-50" stroke="#4ecdc4" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- Target H star -->
  <circle cx="140" cy="38" r="5" fill="#e94560"/>
  <circle cx="140" cy="38" r="9" stroke="#e94560" stroke-width="0.5" fill="none" opacity="0.4"/>
  <text x="140" y="42" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">H</text>

  <!-- Typography -->
  <text x="175" y="58" font-family="Helvetica Neue, Arial" font-size="38" font-weight="500" fill="#ffffff" letter-spacing="3">
    HICOSMO
  </text>

  <!-- JAX Radio -->
  <line x1="175" y1="72" x2="380" y2="72" stroke="#4ecdc4" stroke-width="0.3" opacity="0.4"/>
  <g transform="translate(175, 82)">
    <rect x="0" y="0" width="35" height="14" rx="2" fill="#4ecdc4" opacity="0.15"/>
    <text x="17.5" y="10" text-anchor="middle" font-family="SF Mono" font-size="9" fill="#4ecdc4" font-weight="600">JAX</text>
    <text x="45" y="10" font-family="Helvetica" font-size="9" fill="#fff" opacity="0.5">Radio Cosmology</text>
    <text x="145" y="10" font-family="Courier" font-size="8" fill="#4ecdc4" opacity="0.5">21cm</text>
  </g>
</svg>
