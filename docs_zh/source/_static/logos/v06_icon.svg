<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="v6i_n1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#08080d;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="v6i_n2" cx="70%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#08080d;stop-opacity:0"/>
    </radialGradient>
    <filter id="v6i_blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="v6i_glow">
      <feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="16" fill="#08080d"/>
  <ellipse cx="35" cy="45" rx="40" ry="35" fill="url(#v6i_n1)" filter="url(#v6i_blur)"/>
  <ellipse cx="65" cy="55" rx="35" ry="30" fill="url(#v6i_n2)" filter="url(#v6i_blur)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="0.8" opacity="0.6"/><circle cx="80" cy="25" r="0.6" opacity="0.5"/>
    <circle cx="75" cy="80" r="0.7" opacity="0.5"/><circle cx="25" cy="78" r="0.5" opacity="0.4"/>
  </g>

  <!-- H star -->
  <circle cx="50" cy="45" r="16" fill="#e94560" opacity="0.5" filter="url(#v6i_glow)"/>
  <circle cx="50" cy="45" r="10" fill="#fff" opacity="0.9"/>
  <text x="50" y="50" text-anchor="middle" font-family="Georgia" font-size="12" fill="#e94560" font-weight="bold">H</text>

  <!-- JAX -->
  <text x="50" y="82" text-anchor="middle" font-family="Georgia" font-size="10" fill="#4ecdc4" font-style="italic">JAX</text>
</svg>
