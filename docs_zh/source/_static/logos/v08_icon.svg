<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#000000"/>

  <!-- Dark matter web -->
  <g stroke="#fff" stroke-width="0.3" opacity="0.08">
    <line x1="20" y1="30" x2="45" y2="50"/><line x1="45" y1="50" x2="80" y2="40"/>
    <line x1="45" y1="50" x2="70" y2="75"/>
  </g>

  <!-- Nodes -->
  <g fill="#fff" opacity="0.15">
    <circle cx="45" cy="50" r="2"/><circle cx="70" cy="75" r="1.5"/>
  </g>

  <!-- H void -->
  <circle cx="50" cy="45" r="25" stroke="#fff" stroke-width="0.3" fill="none" opacity="0.1"/>
  <circle cx="50" cy="45" r="18" stroke="#e94560" stroke-width="0.5" fill="none" opacity="0.3"/>
  <circle cx="50" cy="45" r="14" fill="#e94560"/>
  <text x="50" y="50" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#000" font-weight="bold">H</text>

  <!-- JAX -->
  <rect x="30" y="78" width="40" height="3" fill="#e94560"/>
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="9" fill="#e94560" font-weight="700">JAX</text>
</svg>
