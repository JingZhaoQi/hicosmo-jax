<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v11_bg" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="v11_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v11_bg)"/>

  <!-- Cosmic expansion rings -->
  <g transform="translate(65, 70)">
    <!-- Expansion waves from Big Bang -->
    <circle cx="0" cy="0" r="50" stroke="#4ecdc4" stroke-width="0.3" fill="none" opacity="0.15"/>
    <circle cx="0" cy="0" r="42" stroke="#4ecdc4" stroke-width="0.4" fill="none" opacity="0.2"/>
    <circle cx="0" cy="0" r="34" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="26" stroke="#4ecdc4" stroke-width="0.6" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Central singularity -->
    <circle cx="0" cy="0" r="8" fill="url(#v11_glow)"/>
    <circle cx="0" cy="0" r="4" fill="#e94560"/>

    <!-- Expansion arrows -->
    <g stroke="#e94560" stroke-width="1" opacity="0.6">
      <line x1="12" y1="0" x2="28" y2="0"/>
      <line x1="-12" y1="0" x2="-28" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="-28"/>
      <line x1="0" y1="12" x2="0" y2="28"/>
      <line x1="8.5" y1="-8.5" x2="20" y2="-20"/>
      <line x1="-8.5" y1="-8.5" x2="-20" y2="-20"/>
      <line x1="8.5" y1="8.5" x2="20" y2="20"/>
      <line x1="-8.5" y1="8.5" x2="-20" y2="20"/>
    </g>

    <!-- Arrow tips -->
    <g fill="#e94560" opacity="0.6">
      <polygon points="28,0 24,-2 24,2"/>
      <polygon points="-28,0 -24,-2 -24,2"/>
      <polygon points="0,-28 -2,-24 2,-24"/>
      <polygon points="0,28 -2,24 2,24"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="135" y="52" font-family="Helvetica Neue, Arial" font-size="32" font-weight="300" fill="#ffffff" letter-spacing="4">
    HICOSMO
  </text>

  <!-- Subtitle -->
  <text x="135" y="72" font-family="Helvetica Neue, Arial" font-size="10" fill="#4ecdc4" opacity="0.8" letter-spacing="2">
    COSMOLOGICAL PARAMETER ESTIMATION
  </text>

  <!-- JAX branding -->
  <g transform="translate(135, 88)">
    <rect x="0" y="0" width="38" height="16" rx="3" fill="#e94560" opacity="0.15"/>
    <text x="19" y="11.5" text-anchor="middle" font-family="SF Mono, monospace" font-size="10" fill="#e94560" font-weight="600">JAX</text>
    <text x="48" y="11.5" font-family="Helvetica" font-size="9" fill="#4ecdc4" opacity="0.7">Accelerated Bayesian Inference</text>
  </g>
</svg>
