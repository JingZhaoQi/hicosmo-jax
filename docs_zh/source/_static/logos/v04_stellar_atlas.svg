<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <radialGradient id="v4_bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a12"/>
    </radialGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v4_bg)"/>

  <!-- Star field -->
  <g fill="#ffffff">
    <circle cx="40" cy="25" r="1" opacity="0.7"/><circle cx="90" cy="35" r="0.6" opacity="0.5"/>
    <circle cx="140" cy="18" r="0.8" opacity="0.6"/><circle cx="220" cy="28" r="0.7" opacity="0.5"/>
    <circle cx="300" cy="20" r="0.9" opacity="0.7"/><circle cx="360" cy="32" r="0.5" opacity="0.4"/>
    <circle cx="390" cy="45" r="0.7" opacity="0.6"/><circle cx="50" cy="115" r="0.6" opacity="0.5"/>
    <circle cx="320" cy="118" r="0.5" opacity="0.4"/><circle cx="380" cy="110" r="0.7" opacity="0.5"/>
  </g>

  <!-- Constellation lines -->
  <g stroke="#4ecdc4" stroke-width="0.3" opacity="0.25">
    <line x1="45" y1="55" x2="75" y2="42"/><line x1="75" y1="42" x2="105" y2="52"/>
    <line x1="105" y1="52" x2="85" y2="78"/><line x1="85" y1="78" x2="45" y2="55"/>
  </g>

  <!-- Main H star -->
  <circle cx="75" cy="62" r="10" fill="#e94560" opacity="0.9"/>
  <circle cx="75" cy="62" r="15" stroke="#e94560" stroke-width="0.5" fill="none" opacity="0.3"/>
  <text x="75" y="66" text-anchor="middle" font-family="Times, serif" font-size="11" fill="#fff" font-style="italic">H</text>

  <!-- Typography - atlas style -->
  <text x="145" y="58" font-family="Garamond, Georgia, serif" font-size="40" fill="#ffffff" font-style="italic" letter-spacing="1">
    HIcosmo
  </text>

  <!-- Coordinate -->
  <text x="145" y="78" font-family="Courier, monospace" font-size="8" fill="#4ecdc4" opacity="0.6">
    α 12h 30m · δ +41° 16′
  </text>

  <!-- JAX atlas notation -->
  <line x1="145" y1="90" x2="340" y2="90" stroke="#ffffff" stroke-width="0.3" opacity="0.2"/>
  <text x="145" y="105" font-family="Garamond, Georgia, serif" font-size="10" fill="#4ecdc4" font-style="italic">
    JAX Cosmology Atlas
  </text>
  <text x="280" y="105" font-family="Courier, monospace" font-size="8" fill="#ffffff" opacity="0.4">
    NumPyro · MCMC
  </text>
</svg>
