<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v12_bg" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v12_bg)"/>

  <!-- Posterior contour ellipses -->
  <g transform="translate(65, 70)">
    <!-- Coordinate axes -->
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#4ecdc4" stroke-width="0.3" opacity="0.4"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#4ecdc4" stroke-width="0.3" opacity="0.4"/>

    <!-- 3σ contour -->
    <ellipse cx="0" cy="0" rx="42" ry="32" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.2" transform="rotate(-25)"/>
    <!-- 2σ contour -->
    <ellipse cx="0" cy="0" rx="28" ry="21" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.35" transform="rotate(-25)"/>
    <!-- 1σ contour -->
    <ellipse cx="0" cy="0" rx="14" ry="10" stroke="#e94560" stroke-width="1.2" fill="#e94560" fill-opacity="0.15" transform="rotate(-25)"/>

    <!-- Best fit point -->
    <circle cx="0" cy="0" r="3" fill="#e94560"/>

    <!-- Axis labels -->
    <text x="44" y="14" font-family="Times, serif" font-size="10" fill="#4ecdc4" opacity="0.7" font-style="italic">Ω<tspan baseline-shift="sub" font-size="7">m</tspan></text>
    <text x="6" y="-40" font-family="Times, serif" font-size="10" fill="#4ecdc4" opacity="0.7" font-style="italic">H<tspan baseline-shift="sub" font-size="7">0</tspan></text>
  </g>

  <!-- Typography -->
  <text x="135" y="50" font-family="Helvetica Neue, Arial" font-size="32" font-weight="300" fill="#ffffff" letter-spacing="4">
    HICOSMO
  </text>

  <!-- Subtitle with sigma levels -->
  <g transform="translate(135, 62)">
    <text y="10" font-family="Times, serif" font-size="9" fill="#4ecdc4" opacity="0.6">
      <tspan>1σ</tspan>
    </text>
    <circle cx="18" cy="6" r="2" fill="#e94560"/>
    <text x="26" y="10" font-family="Times, serif" font-size="9" fill="#4ecdc4" opacity="0.6">
      <tspan>2σ</tspan>
    </text>
    <circle cx="44" cy="6" r="2" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.5"/>
    <text x="52" y="10" font-family="Times, serif" font-size="9" fill="#4ecdc4" opacity="0.6">
      <tspan>3σ</tspan>
    </text>
    <circle cx="70" cy="6" r="2" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.3"/>
    <text x="80" y="10" font-family="Helvetica" font-size="9" fill="#ffffff" opacity="0.5">
      Bayesian Constraints
    </text>
  </g>

  <!-- JAX + NumPyro -->
  <g transform="translate(135, 88)">
    <rect x="0" y="0" width="38" height="16" rx="3" fill="#e94560" opacity="0.15"/>
    <text x="19" y="11.5" text-anchor="middle" font-family="SF Mono, monospace" font-size="10" fill="#e94560" font-weight="600">JAX</text>
    <rect x="46" y="0" width="58" height="16" rx="3" fill="#4ecdc4" opacity="0.1"/>
    <text x="75" y="11.5" text-anchor="middle" font-family="SF Mono, monospace" font-size="9" fill="#4ecdc4" font-weight="500">NumPyro</text>
    <text x="116" y="11.5" font-family="Helvetica" font-size="9" fill="#ffffff" opacity="0.5">MCMC</text>
  </g>
</svg>
