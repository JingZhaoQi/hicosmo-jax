<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v10i_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="v10i_glow">
      <feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v10i_bg)"/>

  <!-- Sacred geometry -->
  <g transform="translate(50, 45)">
    <!-- Circles -->
    <circle cx="0" cy="0" r="35" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.2"/>
    <circle cx="0" cy="0" r="28" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.35"/>

    <!-- Hexagon -->
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12"
             stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- Radiating lines -->
    <g stroke="#e94560" stroke-width="0.3" opacity="0.5">
      <line x1="0" y1="-35" x2="0" y2="-14"/>
      <line x1="30.3" y1="-17.5" x2="12.1" y2="-7"/>
      <line x1="30.3" y1="17.5" x2="12.1" y2="7"/>
      <line x1="0" y1="35" x2="0" y2="14"/>
      <line x1="-30.3" y1="17.5" x2="-12.1" y2="7"/>
      <line x1="-30.3" y1="-17.5" x2="-12.1" y2="-7"/>
    </g>

    <!-- Vertices -->
    <g fill="#4ecdc4" opacity="0.6">
      <circle cx="0" cy="-24" r="2"/><circle cx="20.8" cy="-12" r="2"/>
      <circle cx="20.8" cy="12" r="2"/><circle cx="0" cy="24" r="2"/>
      <circle cx="-20.8" cy="12" r="2"/><circle cx="-20.8" cy="-12" r="2"/>
    </g>

    <!-- Core -->
    <circle cx="0" cy="0" r="14" fill="#e94560" filter="url(#v10i_glow)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia" font-size="14" fill="#fff" font-weight="bold">H</text>
  </g>

  <!-- JAX -->
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#e94560" font-weight="600">JAX</text>
</svg>
