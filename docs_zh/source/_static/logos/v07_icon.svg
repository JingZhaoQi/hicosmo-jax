<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v7i_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a15"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v7i_sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="20" cy="18" r="0.8" opacity="0.7"/><circle cx="80" cy="22" r="0.6" opacity="0.5"/>
    <circle cx="65" cy="15" r="0.7" opacity="0.6"/><circle cx="35" cy="25" r="0.5" opacity="0.4"/>
  </g>

  <!-- Observatory dome -->
  <g transform="translate(50, 72)">
    <rect x="-18" y="8" width="36" height="20" fill="#1a1a25"/>
    <path d="M -15 8 Q 0 -15, 15 8 Z" fill="#2a2a3e" stroke="#3a3a4e" stroke-width="0.5"/>
    <path d="M -2 8 L -1 -5 L 1 -5 L 2 8 Z" fill="#0a0a15"/>
    <line x1="0" y1="-2" x2="20" y2="-30" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Target star -->
  <circle cx="70" cy="38" r="6" fill="#e94560"/>
  <text x="70" y="41" text-anchor="middle" font-family="Arial" font-size="7" fill="#fff">H</text>

  <!-- JAX -->
  <text x="50" y="18" text-anchor="middle" font-family="SF Mono" font-size="9" fill="#4ecdc4" font-weight="600">JAX</text>
</svg>
