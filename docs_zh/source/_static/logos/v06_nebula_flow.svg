<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <radialGradient id="v6_nebula1" cx="25%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="v6_nebula2" cx="75%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0"/>
    </radialGradient>
    <filter id="v6_blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="v6_glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="420" height="140" fill="#08080d"/>

  <!-- Nebula clouds -->
  <ellipse cx="90" cy="70" rx="110" ry="75" fill="url(#v6_nebula1)" filter="url(#v6_blur)"/>
  <ellipse cx="300" cy="80" rx="100" ry="65" fill="url(#v6_nebula2)" filter="url(#v6_blur)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="28" r="1" opacity="0.7"/><circle cx="110" cy="22" r="0.8" opacity="0.5"/>
    <circle cx="200" cy="18" r="0.6" opacity="0.4"/><circle cx="280" cy="25" r="0.9" opacity="0.6"/>
    <circle cx="360" cy="32" r="0.7" opacity="0.5"/><circle cx="390" cy="48" r="0.5" opacity="0.4"/>
    <circle cx="25" cy="105" r="0.6" opacity="0.5"/><circle cx="385" cy="108" r="0.8" opacity="0.6"/>
  </g>

  <!-- Central H star -->
  <circle cx="65" cy="70" r="18" fill="#e94560" opacity="0.5" filter="url(#v6_glow)"/>
  <circle cx="65" cy="70" r="10" fill="#ffffff" opacity="0.9"/>
  <text x="65" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e94560" font-weight="bold">H</text>

  <!-- Typography -->
  <text x="115" y="72" font-family="Georgia, serif" font-size="42" font-weight="300" fill="#ffffff" font-style="italic" opacity="0.95">
    HIcosmo
  </text>

  <!-- JAX ethereal -->
  <text x="118" y="95" font-family="Georgia, serif" font-size="11" fill="#4ecdc4" font-style="italic" opacity="0.7" letter-spacing="2">
    powered by JAX
  </text>
  <text x="245" y="95" font-family="Georgia, serif" font-size="10" fill="#ffffff" font-style="italic" opacity="0.4">
    · cosmic dawn explorer
  </text>
</svg>
