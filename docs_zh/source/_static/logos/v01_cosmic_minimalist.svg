<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
  </defs>

  <rect width="420" height="140" fill="url(#v1_bg)"/>

  <!-- Minimal hydrogen symbol -->
  <g transform="translate(55, 70)">
    <circle cx="0" cy="0" r="32" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#e94560"/>
    <circle cx="28" cy="-12" r="3" fill="#ffffff"/>
  </g>

  <!-- Clean typography -->
  <text x="105" y="72" font-family="Helvetica Neue, Arial" font-size="44" font-weight="200" fill="#ffffff" letter-spacing="6">
    HICOSMO
  </text>

  <!-- Minimal accent line -->
  <line x1="105" y1="88" x2="340" y2="88" stroke="#e94560" stroke-width="0.5" opacity="0.6"/>

  <!-- JAX badge -->
  <g transform="translate(105, 98)">
    <text font-family="SF Mono, Menlo, monospace" font-size="10" fill="#4ecdc4" letter-spacing="1">
      POWERED BY
    </text>
    <text x="85" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#ffffff" font-weight="600" letter-spacing="1">
      JAX
    </text>
    <text x="110" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#4ecdc4" opacity="0.6" letter-spacing="1">
      + NUMPYRO
    </text>
  </g>

  <!-- Version -->
  <text x="390" y="108" font-family="Helvetica Neue, Arial" font-size="8" fill="#ffffff" opacity="0.3" text-anchor="end">
    v1.0
  </text>
</svg>
