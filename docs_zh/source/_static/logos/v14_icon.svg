<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="v14i_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <filter id="v14i_glow">
      <feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#v14i_bg)"/>

  <!-- w(z) diagram -->
  <g transform="translate(15, 70)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="70" y2="0" stroke="#4ecdc4" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="-55" x2="0" y2="5" stroke="#4ecdc4" stroke-width="0.4" opacity="0.4"/>

    <!-- w = -1 line -->
    <line x1="0" y1="-30" x2="70" y2="-30" stroke="#ffffff" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.3"/>

    <!-- w(z) curve -->
    <path d="M 0,-35 Q 20,-33 40,-30 T 70,-24" stroke="#e94560" stroke-width="2.5" fill="none" filter="url(#v14i_glow)"/>

    <!-- Band -->
    <path d="M 0,-40 Q 20,-37 40,-33 T 70,-28 L 70,-20 Q 40,-27 20,-29 T 0,-30 Z" fill="#e94560" opacity="0.2"/>
  </g>

  <!-- JAX -->
  <text x="50" y="92" text-anchor="middle" font-family="SF Mono" font-size="10" fill="#e94560" font-weight="600">JAX</text>
</svg>
