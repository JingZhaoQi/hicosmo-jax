<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140">
  <defs>
    <linearGradient id="v2_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="v2_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="420" height="140" fill="url(#v2_bg)"/>

  <!-- Dynamic orbital system -->
  <g transform="translate(65, 70)">
    <ellipse cx="0" cy="0" rx="42" ry="16" stroke="#4ecdc4" stroke-width="1" fill="none" transform="rotate(-25)" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="35" ry="13" stroke="#4ecdc4" stroke-width="1.5" fill="none" transform="rotate(15)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="28" ry="10" stroke="#4ecdc4" stroke-width="2" fill="none" transform="rotate(-50)" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="#e94560" filter="url(#v2_glow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#fff">H</text>
    <circle cx="32" cy="-8" r="4" fill="#4ecdc4" filter="url(#v2_glow)"/>
    <circle cx="-22" cy="16" r="3" fill="#4ecdc4" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="130" y="60" font-family="Helvetica Neue, Arial" font-size="36" font-weight="700" fill="#e94560">HI</text>
  <text x="175" y="60" font-family="Helvetica Neue, Arial" font-size="36" font-weight="300" fill="#ffffff">cosmo</text>

  <!-- JAX info -->
  <g transform="translate(130, 75)">
    <rect x="0" y="0" width="45" height="16" rx="3" fill="#4ecdc4" opacity="0.15"/>
    <text x="22.5" y="12" text-anchor="middle" font-family="SF Mono, monospace" font-size="10" fill="#4ecdc4" font-weight="600">JAX</text>
    <text x="55" y="12" font-family="Helvetica, Arial" font-size="9" fill="#ffffff" opacity="0.5">NumPyro MCMC</text>
  </g>

  <!-- Motion lines -->
  <path d="M130 100 Q200 105, 300 98" stroke="#4ecdc4" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
