<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <!-- Gradient for cosmic effect -->
    <linearGradient id="cosmicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>

    <!-- Gradient for the H atom -->
    <radialGradient id="atomGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73659"/>
    </radialGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave pattern for 21cm -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="5" y="10" width="390" height="100" rx="12" ry="12" fill="url(#cosmicGradient)"/>

  <!-- Stars decoration -->
  <circle cx="30" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="55" cy="85" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="370" cy="25" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="90" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="20" r="1" fill="#fff" opacity="0.4"/>

  <!-- 21cm wave pattern (sine wave) -->
  <path d="M 25 60
           Q 40 45, 55 60
           Q 70 75, 85 60
           Q 100 45, 115 60"
        stroke="url(#waveGradient)"
        stroke-width="2.5"
        fill="none"
        opacity="0.6"/>

  <!-- Hydrogen atom symbol (stylized) -->
  <g transform="translate(60, 60)">
    <!-- Electron orbit -->
    <ellipse cx="0" cy="0" rx="28" ry="12"
             stroke="#4ecdc4" stroke-width="1.5" fill="none"
             transform="rotate(-30)" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="28" ry="12"
             stroke="#4ecdc4" stroke-width="1.5" fill="none"
             transform="rotate(30)" opacity="0.7"/>

    <!-- Nucleus (proton) -->
    <circle cx="0" cy="0" r="12" fill="url(#atomGradient)" filter="url(#glow)"/>

    <!-- H letter in nucleus -->
    <text x="0" y="5" text-anchor="middle"
          font-family="Arial, sans-serif" font-weight="bold" font-size="14"
          fill="#fff">H</text>

    <!-- Electron -->
    <circle cx="24" cy="-10" r="4" fill="#4ecdc4" filter="url(#glow)"/>
  </g>

  <!-- HIcosmo text -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <!-- HI part (emphasized) -->
    <text x="115" y="72" font-size="42" font-weight="700" fill="#e94560"
          letter-spacing="-1">HI</text>

    <!-- cosmo part -->
    <text x="168" y="72" font-size="42" font-weight="300" fill="#ffffff"
          letter-spacing="-1">cosmo</text>
  </g>

  <!-- Tagline -->
  <text x="115" y="92" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#4ecdc4" letter-spacing="1">
    JAX-POWERED COSMOLOGY
  </text>

  <!-- Version badge -->
  <g transform="translate(320, 30)">
    <rect x="0" y="0" width="50" height="18" rx="9" ry="9" fill="#e94560" opacity="0.9"/>
    <text x="25" y="13" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">v1.0</text>
  </g>

  <!-- Decorative cosmic ring -->
  <ellipse cx="340" cy="65" rx="25" ry="8"
           stroke="#4ecdc4" stroke-width="1" fill="none"
           opacity="0.4" transform="rotate(-15, 340, 65)"/>
  <circle cx="340" cy="65" r="6" fill="#e94560" opacity="0.6"/>

</svg>
